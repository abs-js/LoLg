<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Hill Fight</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--g0:#1c1f23;--g1:#2a2e33;--g2:#3a4047;--g3:#8b929a;--gold:#c9b27a;--ink:#e8eaed}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#111316;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:var(--ink);user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;display:none;flex-direction:column}
#topbar{display:flex;justify-content:space-between;padding:10px 12px;gap:8px}
.panel{background:rgba(28,31,35,.88);border:1px solid #4a5158;border-radius:12px;padding:8px 12px}
.bar-wrap{width:min(250px,48vw)}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.75;margin-bottom:3px}
.bar{height:10px;border-radius:8px;background:#141618;overflow:hidden;border:1px solid #000}
.bar>i{display:block;height:100%;width:0}
#hpFill{background:#c0392b}#s1Fill{background:#5b8def}#s2Fill{background:#9b6ad6}
#waveBox{text-align:right;min-width:120px}#waveBox b{color:var(--gold);font-size:17px}
#bottomHud{margin-top:auto;padding:10px 12px 18px}.ability{font-size:11px;max-width:56vw}
#overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(10,12,14,.86)}
.card{width:min(920px,96vw);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#2a2e33,#1c1f23);border:2px solid #5a6168;border-radius:16px;padding:18px}
h1{font-size:clamp(26px,6vw,38px);text-align:center;color:#d7dde3;letter-spacing:.12em}
.sub{text-align:center;opacity:.8;margin:6px 0 14px;font-size:13px;color:#b4bac0}
h2{font-size:12px;color:#9aa3ab;margin:10px 0 8px;letter-spacing:.1em;text-transform:uppercase}
.coins{text-align:center;color:var(--gold);font-weight:700;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pick{flex:1 1 150px;background:#23272b;border:1px solid #4a5158;border-radius:12px;padding:10px;cursor:pointer;pointer-events:auto}
.pick.on{border-color:var(--gold)}.pick.lock{opacity:.72}
.pick h3{font-size:14px;margin-bottom:3px}.pick p{font-size:12px;opacity:.88;line-height:1.35}
.price{color:var(--gold);font-weight:700;font-size:12px;margin-top:4px}
.mini{height:70px;display:flex;align-items:center;justify-content:center}
button.cta,button.ghost,button.tab{pointer-events:auto;cursor:pointer;border-radius:12px;font-weight:800}
button.cta{display:block;width:100%;margin-top:12px;background:#3a4047;color:#eef1f4;font-size:16px;border:1px solid #6a727a;padding:12px}
button.cta:hover{background:#4a5158}
button.ghost{background:transparent;color:#c5cbd1;border:1px solid #4a5158;padding:10px 12px;width:100%;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button.tab{flex:1;border:1px solid #4a5158;background:#23272b;color:#d7dde3;padding:10px 6px;font-size:13px}
button.tab.on{border-color:var(--gold);color:var(--gold)}
.modes,.modes4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modes3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modeBtn{pointer-events:auto;cursor:pointer;background:#23272b;border:1px solid #4a5158;border-radius:12px;padding:10px 8px;text-align:center}
.modeBtn.on{border-color:var(--gold)}
.modeBtn h3{font-size:13px;margin-bottom:3px}.modeBtn p{font-size:11px;opacity:.8}
.help{margin-top:10px;font-size:12px;opacity:.7;text-align:center;line-height:1.4}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:1px solid #4a5158;background:#141618;color:#eef1f4;font-size:16px;text-align:center}
.keyBig{font-size:clamp(26px,8vw,40px);letter-spacing:.28em;text-align:center;color:var(--gold);font-weight:800;margin:8px 0 12px}
.plist{background:#141618;border-radius:10px;padding:8px 12px;margin:8px 0}
.plist div{padding:6px 0;border-bottom:1px solid #2e3338;font-size:14px;cursor:pointer}
.logo{display:block;margin:0 auto 10px;width:72px;height:72px}
.setrow{display:flex;justify-content:space-between;align-items:center;background:#23272b;border:1px solid #3a4047;border-radius:10px;padding:10px 12px;margin:6px 0;font-size:14px}
.setrow button{width:auto;margin:0;padding:6px 10px}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#1c1f23;border:1px solid var(--gold);padding:8px 14px;border-radius:8px;display:none;z-index:12}
#loadScr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#111316;flex-direction:column;padding:24px;text-align:center}
#loadScr h2{color:#d7dde3;font-size:26px;margin-bottom:8px}
.lbar{width:min(320px,80vw);height:12px;background:#141618;border:1px solid #5a6168;border-radius:10px;overflow:hidden}
.lbar>i{display:block;height:100%;width:0;background:#8b929a}
#pads{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#joyBase,#btnP,#btnS,#btnL,#btnX,#btnY,#btnR{pointer-events:auto;position:absolute}
#joyBase{width:132px;height:132px;border-radius:50%;background:rgba(28,31,35,.45);border:3px solid rgba(200,210,220,.28)}
#joyKnob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(200,210,220,.8)}
.abtn{border-radius:50%;border:3px solid rgba(255,255,255,.22);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;box-shadow:0 8px 0 rgba(0,0,0,.35)}
#btnP{width:78px;height:78px;background:#8a3a32;font-size:13px}
#btnS{width:64px;height:64px;background:#2f5aa8;font-size:11px}
#btnL{width:58px;height:58px;background:#6a3d9a;font-size:11px}
#btnX,#btnY,#btnR{width:50px;height:50px;font-size:10px}
#btnX,#btnY{display:none}
#btnX{background:#7a3030}#btnY{background:#2a6a7a}#btnR{background:#2e7a48}
#pauseBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:auto;display:none;background:#1c1f23;color:#d7dde3;border:1px solid #5a6168;border-radius:10px;padding:6px 12px;font-weight:800}
.flash{position:fixed;inset:0;pointer-events:none;z-index:3;display:none}
</style>
</head>
<body>
<svg class="logo" id="logoSvg" viewBox="0 0 72 72" style="display:none" xmlns="http://www.w3.org/2000/svg">
  <circle cx="36" cy="36" r="34" fill="#2a2e33" stroke="#8b929a" stroke-width="3"/>
  <path d="M10 50 L28 28 L36 38 L48 20 L62 50 Z" fill="#4a5158"/>
  <path d="M20 50 L28 36 L36 44 L46 30 L56 50 Z" fill="#8b929a"/>
  <rect x="33" y="40" width="6" height="16" fill="#c9b27a"/>
</svg>
<canvas id="c"></canvas>
<div class="flash" id="flash"></div>
<button id="pauseBtn">Menu</button>
<div id="hud">
  <div id="topbar">
    <div class="panel bar-wrap">
      <div class="label">Vida</div><div class="bar"><i id="hpFill"></i></div>
      <div class="label" style="margin-top:6px">Especial 1</div><div class="bar"><i id="s1Fill"></i></div>
      <div class="label" style="margin-top:6px">Especial 2</div><div class="bar"><i id="s2Fill"></i></div>
    </div>
    <div class="panel" id="waveBox">
      <div id="waveLine">Onda <b>1</b></div>
      <div id="modeLine">Hill Fight</div>
      <div>Moedas <b id="runCoins">0</b></div>
    </div>
  </div>
  <div id="bottomHud"><div class="panel ability" id="abilText"></div></div>
</div>
<div id="pads">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="abtn" id="btnY">GELO</div>
  <div class="abtn" id="btnX">SOBRE</div>
  <div class="abtn" id="btnR">CURA</div>
  <div class="abtn" id="btnL">ESP2</div>
  <div class="abtn" id="btnS">ESP1</div>
  <div class="abtn" id="btnP">ATK</div>
</div>
<div id="toast"></div>
<div id="loadScr"><h2 id="loadTitle">Carregando</h2><p id="loadTip">A colina acorda...</p><div class="lbar"><i id="loadBar"></i></div></div>
<div id="overlay"></div>
<script>
(() => {
  const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
  const hud=document.getElementById("hud"), overlay=document.getElementById("overlay");
  const pads=document.getElementById("pads"), pauseBtn=document.getElementById("pauseBtn");
  const loadScr=document.getElementById("loadScr"), flashEl=document.getElementById("flash");
  const WORLD={w:1840,h:1380};
  const CHEST={x:920,y:690,r:34,hp:100,max:100};
  const HILL={x:920,y:690,r:110};
  const LOGO=`<svg class="logo" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg"><circle cx="36" cy="36" r="34" fill="#2a2e33" stroke="#8b929a" stroke-width="3"/><path d="M10 50 L28 28 L36 38 L48 20 L62 50 Z" fill="#4a5158"/><path d="M20 50 L28 36 L36 44 L46 30 L56 50 Z" fill="#8b929a"/><rect x="33" y="40" width="6" height="16" fill="#c9b27a"/></svg>`;
  const TIPS=["Especial 1 enche ao acertar.","Especial 2 enche com o tempo.","Canhoto vira os botões nas configs.","Gosmas desviam de rio e pedra.","Pack Race: escudo no respawn até atacar."];
  const TEAM=["Ouro","Anil","Rubi","Jade"], TCOL=["#c9b27a","#7ec8ff","#e07070","#7dcf8a"];
  const CHARS=[
    {id:"kai",name:"Kai",color:"#3a6db5",cost:0,weapon:"sword",desc:"Corte em cone. Giro. Fissura no chão.",hp:125,speed:198,pName:"Corte",sName:"Giro",lName:"Fissura",pDmg:20,sDmg:18,lDmg:34},
    {id:"meil",name:"Meil",color:"#3f9a58",cost:90,weapon:"bow",desc:"Flecha. Leque de flechas. Chuva na tela.",hp:96,speed:218,pName:"Flecha",sName:"Giro de flecha",lName:"Chuva",pDmg:16,sDmg:11,lDmg:13},
    {id:"nok",name:"Nok",color:"#d8dee4",cost:130,weapon:"rang",desc:"Bumerangue. Persegue e fura todos. Eixo.",hp:108,speed:206,pName:"Bumerangue",sName:"Acerto garantido",lName:"Eixo",pDmg:15,sDmg:20,lDmg:10},
    {id:"rist",name:"Rist",color:"#b44a3c",cost:160,weapon:"blade",desc:"Corte rápido. Dash perfurante. Titânio com atraso.",hp:118,speed:210,pName:"Corte rápido",sName:"Dash cortante",lName:"Titânio",pDmg:12,sDmg:24,lDmg:48},
    {id:"roy",name:"Roy",color:"#e6c84a",cost:140,weapon:"bolt",desc:"Raio curto. Trovão em 8 direções. Corrente que roteia.",hp:102,speed:208,pName:"Raio",sName:"Trovão",lName:"Perfuramento",pDmg:17,sDmg:12,lDmg:36},
    {id:"feth",name:"Feth",color:"#e07030",cost:150,weapon:"fire",desc:"Corte de fogo. Tornado parado. Bolas de lava.",hp:110,speed:200,pName:"Corte de fogo",sName:"Tornado",lName:"Bola de lava",pDmg:16,sDmg:9,lDmg:14},
    {id:"fror",name:"Fror",color:"#7ec8ff",cost:150,weapon:"ice",desc:"Gelo. Congela perto. Trinca a tela.",hp:108,speed:196,pName:"Projétil de gelo",sName:"Resfriar",lName:"Trinca",pDmg:15,sDmg:8,lDmg:28},
    {id:"lun",name:"Lun",color:"#6b5aa8",cost:170,weapon:"moon",desc:"Orbe lento. Descanso e sono. Escuridão.",hp:100,speed:202,pName:"Orbe",sName:"Descansar",lName:"Escuridão",pDmg:14,sDmg:0,lDmg:0}
  ];
  const SKILLS=[
    {id:"rec1",name:"Recuperação I",desc:"Cura lenta.",cost:0,g:"rec",lv:1},
    {id:"rec2",name:"Recuperação II",desc:"Cura média.",cost:55,g:"rec",lv:2},
    {id:"rec3",name:"Recuperação III",desc:"Cura forte.",cost:110,g:"rec",lv:3},
    {id:"for1",name:"Força I",desc:"+12% dano.",cost:40,g:"for",lv:1},
    {id:"for2",name:"Força II",desc:"+22% dano.",cost:80,g:"for",lv:2},
    {id:"for3",name:"Força III",desc:"+35% dano.",cost:130,g:"for",lv:3},
    {id:"vel1",name:"Velocidade I",desc:"+10% velocidade.",cost:40,g:"vel",lv:1},
    {id:"vel2",name:"Velocidade II",desc:"+20% velocidade.",cost:80,g:"vel",lv:2},
    {id:"vel3",name:"Velocidade III",desc:"+32% velocidade.",cost:130,g:"vel",lv:3},
    {id:"ene1",name:"Energético I",desc:"Especial 1 recarrega sozinho.",cost:70,g:"ene",lv:1},
    {id:"ene2",name:"Energético II",desc:"Especial 1 recarrega mais.",cost:120,g:"ene",lv:2},
    {id:"ovr1",name:"Sobre-poder I",desc:"Botão extra. Dano em você e em todos.",cost:90,g:"ovr",lv:1},
    {id:"ovr2",name:"Sobre-poder II",desc:"Botão extra. Dano maior nos dois.",cost:150,g:"ovr",lv:2},
    {id:"ice1",name:"Resfriamento I",desc:"Botão extra. Gela a tela. Todos lentos.",cost:90,g:"ice",lv:1},
    {id:"ice2",name:"Resfriamento II",desc:"Botão extra. Gelo mais forte.",cost:150,g:"ice",lv:2}
  ];

  let bank=+localStorage.getItem("hf_coins")||0;
  let user=localStorage.getItem("hf_user")||"";
  let unlocked=JSON.parse(localStorage.getItem("hf_uchars")||'["kai"]');
  let unlockedSk=JSON.parse(localStorage.getItem("hf_uskills")||'["rec1"]');
  let selChar=localStorage.getItem("hf_selC")||"kai";
  let selSkill=localStorage.getItem("hf_selS")||"rec1";
  let cfg=JSON.parse(localStorage.getItem("hf_cfg")||'{"gfx":"med","left":false,"four":true}');
  if(!unlocked.includes(selChar)) selChar="kai";
  if(!unlockedSk.includes(selSkill)) selSkill="rec1";

  let screen=user?"home":"name", mode="defend", state="menu";
  let W=800,H=600,dpr=1,cam={x:0,y:0},t=0,last=0;
  let actors=[],slimes=[],shots=[],fx=[],texts=[],drops=[],zones=[],walls=[];
  let leaves=[],trees=[],bushes=[],flowers=[],paths=[],rocks=[],rivers=[],spots=[];
  let maze=[], raceStart=null, raceEnd=null, boss=null;
  let wave=1,toSpawn=0,spawnWait=0,waveWait=0,kills=0,runCoins=0,shake=0,orbT=0,iceT=0,scoreNeed=50;
  let podio=[], teamElim=[];
  let qPressed=false,wantS=false,wantP=false,wantX=false,wantY=false,wantR=false;
  const keys=Object.create(null), mouse={x:400,y:300,down:false,rd:false}, joy={mx:0,my:0};
  const net={role:"solo",peer:null,conns:[],key:null,lobby:[],meId:"local",acc:0,nid:1};

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,k)=>a+(b-a)*k;
  const dist=(a,b)=>Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));
  const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
  let _rng=Math.random;
  const rand=(a,b)=>a+_rng()*(b-a);
  const irand=(a,b)=>a+Math.floor(_rng()*(b-a+1));
  const pick=a=>a[irand(0,a.length-1)];
  function seedRng(s){ let n=(+s||1)>>>0; _rng=()=>{ n=(Math.imul(n,1664525)+1013904223)>>>0; return n/4294967296; }; }
  function freeRng(){ _rng=Math.random; }
  const charOf=id=>CHARS.find(c=>c.id===id)||CHARS[0];
  const skillOf=id=>SKILLS.find(s=>s.id===id)||SKILLS[0];
  const isPvp=()=>["ffa","team2","team4","koth","race","random"].includes(mode);
  const living=()=>actors.filter(a=>a.alive&&a.hp>0);
  function foes(p){
    if(!p) return [];
    if(mode==="defend"||mode==="boss") return [];
    if(mode==="ffa"||mode==="koth"||mode==="race") return living().filter(a=>a.id!==p.id);
    if(mode==="team2"||mode==="team4") return living().filter(a=>a.id!==p.id&&a.team!==p.team);
    return [];
  }
  function foesId(id){ return foes(actors.find(a=>a.id===id)||{id,team:-9}); }
  function save(){ localStorage.setItem("hf_coins",bank); localStorage.setItem("hf_user",user); localStorage.setItem("hf_uchars",JSON.stringify(unlocked)); localStorage.setItem("hf_uskills",JSON.stringify(unlockedSk)); localStorage.setItem("hf_selC",selChar); localStorage.setItem("hf_selS",selSkill); localStorage.setItem("hf_cfg",JSON.stringify(cfg)); }
  function toast(m){ const e=document.getElementById("toast"); e.textContent=m; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display="none",1600); }
  let actx=null;
  function beep(f,d,ty,v){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.type=ty||"square"; o.frequency.value=f; g.gain.value=v||.04; g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
  function showLoad(title,ms){ return new Promise(res=>{ loadScr.style.display="flex"; document.getElementById("loadTitle").textContent=title; document.getElementById("loadTip").textContent=pick(TIPS); const bar=document.getElementById("loadBar"); bar.style.width="0"; const t0=performance.now(); (function step(n){ const k=Math.min(1,(n-t0)/ms); bar.style.width=(k*100)+"%"; if(k<1) requestAnimationFrame(step); else setTimeout(()=>{loadScr.style.display="none";res();},140); })(t0); }); }
  function flash(col,ms){ flashEl.style.display="block"; flashEl.style.background=col; setTimeout(()=>flashEl.style.display="none",ms||80); }
  const hi=()=>cfg.gfx==="high", lo=()=>cfg.gfx==="low";

  function resize(){ dpr=Math.min(devicePixelRatio||1, hi()?2:1.4); W=innerWidth; H=innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener("resize",resize); resize();
  addEventListener("keydown",e=>{ keys[e.code]=true; if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault(); if(e.code==="KeyQ") qPressed=true; if(e.code==="KeyE") wantX=true; if(e.code==="KeyF") wantY=true; if(e.code==="KeyR") wantR=true; if(e.code==="Escape"&&state==="play") openPause(); if(e.code==="Space"&&state==="menu"&&screen==="chars"){ screen="tier"; renderMenu(); } });
  addEventListener("keyup",e=>keys[e.code]=false);
  canvas.addEventListener("mousedown",e=>{ if(e.button===0) mouse.down=true; if(e.button===2) mouse.rd=true; });
  addEventListener("mouseup",e=>{ if(e.button===0) mouse.down=false; if(e.button===2) mouse.rd=false; });
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("mousemove",e=>{ const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
  const isTouch=()=>matchMedia("(pointer: coarse)").matches||"ontouchstart" in window;
  function bindPad(el,on,off){ const d=ev=>{ev.preventDefault();on();},u=ev=>{ev.preventDefault();off();}; el.addEventListener("touchstart",d,{passive:false}); el.addEventListener("touchend",u,{passive:false}); el.addEventListener("mousedown",d); addEventListener("mouseup",u); }
  bindPad(document.getElementById("btnP"),()=>wantP=true,()=>wantP=false);
  bindPad(document.getElementById("btnS"),()=>wantS=true,()=>wantS=false);
  bindPad(document.getElementById("btnL"),()=>{qPressed=true;},()=>{});
  bindPad(document.getElementById("btnX"),()=>{wantX=true;},()=>{});
  bindPad(document.getElementById("btnR"),()=>{wantR=true;},()=>{});
  bindPad(document.getElementById("btnY"),()=>{wantY=true;},()=>{});
  const joyBase=document.getElementById("joyBase"), joyKnob=document.getElementById("joyKnob");
  function setKnob(x,y){ joyKnob.style.left=(41+x*34)+"px"; joyKnob.style.top=(41+y*34)+"px"; }
  function joyEv(ev){ const rec=joyBase.getBoundingClientRect(); const tc=ev.changedTouches?ev.changedTouches[0]:ev; let dx=tc.clientX-(rec.left+rec.width/2),dy=tc.clientY-(rec.top+rec.height/2); const m=Math.hypot(dx,dy)||1,max=rec.width*.42; if(m>max){dx=dx/m*max;dy=dy/m*max;} joy.mx=dx/max; joy.my=dy/max; setKnob(joy.mx,joy.my); }
  joyBase.addEventListener("touchstart",e=>{e.preventDefault();joyEv(e);},{passive:false});
  joyBase.addEventListener("touchmove",e=>{e.preventDefault();joyEv(e);},{passive:false});
  joyBase.addEventListener("touchend",e=>{e.preventDefault();joy.mx=0;joy.my=0;setKnob(0,0);},{passive:false});
  const toW=p=>({x:p.x+cam.x,y:p.y+cam.y});

  function layoutPads(){
    const L=cfg.left, four=cfg.four!==false;
    const jb=joyBase.style, p=document.getElementById("btnP").style, s=document.getElementById("btnS").style, l=document.getElementById("btnL").style;

  function sim(p,dt){
    if(!p.alive) return;
    p.rest=Math.max(0,(p.rest||0)-dt); p.sleep=Math.max(0,(p.sleep||0)-dt); p.dark=Math.max(0,(p.dark||0)-dt);
    if(p.sleep>0) return;
    const iceSlow=iceT>0?0.45:1;
    const canMove=p.rest<=0;
    const n=Math.hypot(p.mx,p.my); if(canMove&&n>.08){ tryMove(p,(p.mx/n)*p.speed*dt*iceSlow,(p.my/n)*p.speed*dt*iceSlow); p.step+=dt*8; }
    p.ang=aim(p);
    p.cdP=Math.max(0,p.cdP-dt); p.cdS=Math.max(0,p.cdS-dt); p.cdL=Math.max(0,p.cdL-dt); p.cdX=Math.max(0,p.cdX-dt); p.cdY=Math.max(0,p.cdY-dt);
    p.hurt=Math.max(0,p.hurt-dt); p.inv=Math.max(0,p.inv-dt); p.shield=Math.max(0,(p.shield||0)-dt); p.fr=Math.max(0,(p.fr||0)-dt); p.slow=Math.max(0,(p.slow||0)-dt);
    p.s2=Math.min(100,p.s2+dt*3.4);
    if(p.ene) p.s1=Math.min(100,p.s1+p.ene*dt);
    if(p.regen&&p.hp>0) p.hp=Math.min(p.max,p.hp+p.regen*dt);
    if(mode==="koth"&&Math.hypot(p.x-HILL.x,p.y-HILL.y)<HILL.r){ p.score=(p.score||0)+dt; if(p.score>=scoreNeed) endGame(p.name+" dominou a colina!",true); }
    if(mode==="race"&&raceEnd&&Math.hypot(p.x-raceEnd.x,p.y-raceEnd.y)<raceEnd.r) endGame(p.name+" venceu a Pack Race!",true);
    if(p.fr>0) return;
    if(p.atk) fireP(p); if(p.spec) fireS(p); if(p.lim) fireL(p); if(p.useX) fireOvr(p); if(p.useY) fireIce(p); if(p.useR) fireHeal(p);

  function pickHunt(s){
    const L=living();
    const nearP=L.length?L.reduce((b,p)=>dist(s,p)<dist(s,b)?p:b,L[0]):null;
    const pd=nearP?dist(s,nearP):9999;
    if(mode!=="defend") return nearP||{x:WORLD.w/2,y:WORLD.h/2};
    if(!nearP) return CHEST;
    if(s.kind==="fast") return nearP;
    if(s.kind==="tank"||s.kind==="king") return pd<140?nearP:CHEST;
    if(pd<240) return nearP;
    return CHEST;
  }
  function slimeThink(s,dt){
    s.hop+=dt*6; s.hit=Math.max(0,s.hit-dt); s.slow=Math.max(0,s.slow-dt); s.fr=Math.max(0,s.fr-dt); s.sleep=Math.max(0,(s.sleep||0)-dt);
    if(s.fr>0||s.sleep>0) return;
    if(blocked(s.x,s.y,s.r)){
      const w=nearestWalk(s.x,s.y);
      tryMove(s,(w.x-s.x)*.12,(w.y-s.y)*.12);
    }
    const target=pickHunt(s);
    s.pathT=(s.pathT||0)-dt;
    if(s.pathT<=0 || !s.wx){
      const step=nextStep(s.x,s.y,target.x,target.y);
      if(step && Math.hypot(step.x-s.x,step.y-s.y)>4){ s.wx=step.x; s.wy=step.y; }
      else {
        const a=ang(s,target), look=80;
        let found=false;
        for(const off of [0,.6,-.6,1.2,-1.2,2,-2]){
          const nx=s.x+Math.cos(a+off)*look, ny=s.y+Math.sin(a+off)*look;
          if(!blocked(nx,ny,s.r+2)){ s.wx=nx; s.wy=ny; found=true; break; }
        }
        if(!found){ const w=nearestWalk(s.x+rand(-120,120),s.y+rand(-120,120)); s.wx=w.x; s.wy=w.y; }
      }
      s.pathT=.22;
    }
    const iceSlow=iceT>0?0.45:1;
    const sp=s.speed*(s.slow>0?.4:1)*iceSlow;
    let a=Math.atan2(s.wy-s.y,s.wx-s.x);
    if(Math.hypot(s.wx-s.x,s.wy-s.y)<16) s.pathT=0;
    if(!tryMove(s,Math.cos(a)*sp*dt,Math.sin(a)*sp*dt)){
      const w=nearestWalk(s.x+Math.cos(a+1.2)*60,s.y+Math.sin(a+1.2)*60);
      s.wx=w.x; s.wy=w.y; s.pathT=.15;
    }
    living().forEach(p=>{ if(dist(s,p)<s.r+p.r){ dmgP(p,s.dmg); const u=ang(s,p); tryMove(p,Math.cos(u)*8,Math.sin(u)*8); } });
    if(mode==="defend"&&dist(s,CHEST)<s.r+CHEST.r){ dmgChest(s.dmg*.32); const u=ang(CHEST,s); tryMove(s,Math.cos(u)*12,Math.sin(u)*12); }
  }

      if(z.type==="tornado"){ const o=actors.find(a=>a.id===z.own); if(o){ z.x=o.x; z.y=o.y; } hitCirc(o||{id:z.own,team:-1},z.x,z.y,52,z.dmg*dt*3.2,0.2,2); }

  function update(dt){
    if(net.role==="guest"){ guest(dt); return; }
    t+=dt; if(shake>0) shake=Math.max(0,shake-dt*28); iceT=Math.max(0,iceT-dt);
    leaves.forEach(l=>{ l.x+=l.vx*dt; l.y+=l.vy*dt; if(l.y>WORLD.h+20){l.y=-10;l.x=rand(0,WORLD.w);} });
    const loc=me(); if(loc) inputs(loc); actors.forEach(p=>sim(p,dt));
    drops.forEach(d=>{ d.life-=dt; d.bob+=dt*5; living().forEach(p=>{ if(dist(p,d)<26){ p.s1=Math.min(100,p.s1+d.v*.35); addTx(d.x,d.y-10,"energia","#7ec8ff"); d.life=0; } }); }); drops=drops.filter(d=>d.life>0);
    if(mode==="defend"||mode==="boss"){
      if(toSpawn>0){ spawnWait-=dt; if(spawnWait<=0){ let k="normal"; const r=Math.random(); if(wave>=2&&r<.22) k="fast"; if(wave>=3&&r>.78) k="tank"; if(mode==="boss"&&toSpawn===1) k="king"; spawnSlime(k); toSpawn--; spawnWait=Math.max(.18,.55-wave*.03); } }
      else if(!slimes.length){ waveWait+=dt; if(waveWait>1.2){ wave++; if(mode!=="boss") runCoins+=6+wave; toast("Onda "+wave+"!"); startWave(); } }
    } else if(mode==="ffa"||mode==="team2"||mode==="team4"||mode==="koth"){
      orbT-=dt; if(orbT<=0){ orbT=3.4; let x=rand(140,WORLD.w-140),y=rand(140,WORLD.h-140),g=0; while(blocked(x,y,12)&&g++<18){x=rand(140,WORLD.w-140);y=rand(140,WORLD.h-140);} if(!blocked(x,y,12)) addDrop(x,y,40); }
    }
    slimes.forEach(s=>slimeThink(s,dt)); slimes=slimes.filter(s=>s.hp>0);
    shots.forEach(sh=>{
      if(sh.home){ sh.turn+=dt; const o=actors.find(a=>a.id===sh.from); if(o&&sh.turn>.4){ sh.a=lerp(sh.a,ang(sh,o),.14); if(dist(sh,o)<16&&sh.turn>.55) sh.life=0; } }
      if(sh.type==="seekall"){
        sh.seen=sh.seen||{};
        const all=slimes.concat(foesId(sh.own)).filter(s=>s.hp>0);
        let pool=all.filter(s=>!sh.seen[s.nid||s.id]);
        if(!pool.length){ sh.seen={}; pool=all; }
        if(pool.length){ const n=pool.reduce((b,s)=>dist(sh,s)<dist(sh,b)?s:b,pool[0]); sh.a=lerp(sh.a,ang(sh,n),.28); }
      }
      if(sh.type==="seek"){ const o=actors.find(a=>a.id===sh.own); const n=near(o||sh,true); if(n) sh.a=lerp(sh.a,ang(sh,n),.1); }
      if(sh.type==="lob"){ sh.z=(sh.z||0)+(sh.vz||0)*dt; sh.vz=(sh.vz||0)-420*dt; if(sh.z<=0){ zones.push({type:"lava",own:sh.own,x:sh.x,y:sh.y,life:3.2,dmg:sh.dmg}); addFx({type:"burst",x:sh.x,y:sh.y,life:.3,col:"#ff8844"}); sh.life=0; } }
      sh.x+=Math.cos(sh.a)*sh.sp*dt; sh.y+=Math.sin(sh.a)*sh.sp*dt; sh.life-=dt;
      if(sh.cd) for(const k in sh.cd) sh.cd[k]-=dt;
      if(!hi()||true) if(!lo()) addFx({type:"trail",x:sh.x,y:sh.y,life:.12,col:sh.type==="rang"?"#d8dee4":"#b8d0ff"});
      for(const rk of rocks) if(Math.hypot(sh.x-rk.x,sh.y-rk.y)<rk.r+sh.r && sh.type!=="pierce"&&sh.type!=="seekall") sh.life=0;
      const o=actors.find(a=>a.id===sh.own);
      slimes.concat(foesId(sh.own)).forEach(s=>{
        if(sh.life<=0) return;
        if(dist(sh,s)<s.r+sh.r){
          const key=s.nid||s.id||(s.nid="t"+(++net.nid));
          if(sh.type==="rang"||sh.type==="seekall"){ sh.cd=sh.cd||{}; if((sh.cd[key]||0)>0) return; sh.cd[key]=.45; if(sh.type==="seekall"){ sh.seen=sh.seen||{}; sh.seen[key]=1; } }
          if(sh.type==="ice") s.fr=Math.max(s.fr||0,1.1);
          hit(s,sh.dmg,0,5,o||sh);
          if(sh.type==="chain" && (sh.hops||0)<4){
            const nxt=slimes.concat(foesId(sh.own)).filter(t=>t!==s&&t.hp>0).sort((a,b)=>dist(s,a)-dist(s,b))[0];
            const aa=nxt?ang(s,nxt):sh.a;
            addShot({type:"chain",own:sh.own,x:s.x,y:s.y,a:aa,sp:560,life:.26,dmg:sh.dmg*.9,r:7,hops:(sh.hops||0)+1});
            sh.life=0;
          }
          if(sh.type!=="pierce"&&sh.type!=="rang"&&sh.type!=="seekall"&&sh.type!=="chain") sh.life=0;
        }
      });
    });
    shots=shots.filter(sh=>sh.life>0&&sh.x>-50&&sh.y>-50&&sh.x<WORLD.w+50&&sh.y<WORLD.h+50);
    tickZones(dt); fx.forEach(f=>f.life-=dt); fx=fx.filter(f=>f.life>0); texts.forEach(tx=>{tx.life-=dt;tx.y+=tx.vy*dt;}); texts=texts.filter(tx=>tx.life>0);
    const f=me(); if(f){ cam.x=clamp(f.x-W/2,0,Math.max(0,WORLD.w-W)); cam.y=clamp(f.y-H/2,0,Math.max(0,WORLD.h-H)); if(shake){cam.x+=rand(-shake,shake);cam.y+=rand(-shake,shake);} }
    hudUp(); if(net.role==="host"){ net.acc+=dt; if(net.acc>.06){ net.acc=0; sendState(); } }
  }
  function guest(dt){

    shots.forEach(sh=>{ if(sh.sp){ sh.x+=Math.cos(sh.a||0)*sh.sp*dt; sh.y+=Math.sin(sh.a||0)*sh.sp*dt; } });
    fx.forEach(f=>f.life-=dt); fx=fx.filter(f=>f.life>0); texts.forEach(tx=>{tx.life-=dt;tx.y+=(tx.vy||-28)*dt;}); texts=texts.filter(tx=>tx.life>0);
    zones.forEach(z=>{ z.life-=dt; if(z.type==="orbit"){ const o=actors.find(a=>a.id===z.own); if(o){ z.ang0=(z.ang0||0)+dt*3.6; z.x=o.x+Math.cos(z.ang0)*(z.r||44); z.y=o.y+Math.sin(z.ang0)*(z.r||44);} } });

  function hudUp(){

    if(["ffa","team2","team4","koth","race"].includes(mode)&&net.lobby.length<2){ toast("Precisa de 2 jogadores"); return; }
    const nTeam=mode==="team4"?4:2;
    const roster=net.lobby.map((p,i)=>({id:p.id,cid:p.cid,name:p.name,team:mode==="team4"||mode==="team2"?(p.team%nTeam):0}));
    const seed=(Date.now()^irand(1,999999))>>>0;
    broadcast({t:"start",mode,roster,seed});
    showLoad("Carregando...",1000).then(()=>{ setupWorld(seed); actors=roster.map((r,i)=>{ const sp=spawnAt(i,r.team); return makeA(r.id,r.cid,sp.x,sp.y,r.name,r.team); }); sendMap(); startPlay(); });
  }
  function openPause(){
    if(net.role==="guest"){ toast("Só o dono pausa"); return; }
    state="pause"; overlay.style.display="flex"; pads.style.display="none";
    overlay.innerHTML=`<div class="card" style="max-width:420px">${LOGO}<h1>Pausa</h1><button class="cta" id="btnRes">Continuar</button><button class="ghost" id="btnQuit">Sair</button></div>`;
    document.getElementById("btnRes").onclick=()=>{ state="play"; overlay.style.display="none"; pads.style.display=isTouch()?"block":"none"; };
    document.getElementById("btnQuit").onclick=()=>{ closeNet(); state="menu"; hud.style.display="none"; pauseBtn.style.display="none"; screen="home"; renderMenu(); };
  }
  pauseBtn.onclick=()=>{ if(state==="play") openPause(); };
  function nav(h){ overlay.style.display="flex"; overlay.innerHTML=h; }
  function drawMini(m,ch,x,y){ m.save(); m.translate(x,y); m.fillStyle=ch.color; m.beginPath(); m.arc(0,0,16,0,6.3); m.fill(); m.fillStyle="#d7dee8"; m.fillRect(10,-2,16,4); m.restore(); }

  const ON_MODES=[["defend","Proteger baú","Juntos no baú"],["ffa","Free-for-all","Último de pé"],["team2","Batalha de time","2 times"],["team4","4 times","Ouro Anil Rubi Jade"],["boss","Boss infinito","Coop sem fim"],["race","Pack Race","Labirinto até a saída"],["koth","King of the Hill","A colina no centro"],["random","Aleatório","Race / times / colina / FFA"]];

  function renderLobby(){
    state="menu"; overlay.style.display="flex"; const host=net.role==="host";
    const list=(net.lobby||[]).map(p=>`<div data-id="${p.id}">${p.host?"★ ":""}${p.name}${(mode==="team2"||mode==="team4")?" · "+TEAM[p.team||0]:""}${p.host?" (dono)":""}</div>`).join("")||"<div>Esperando...</div>";
    const btns=ON_MODES.map(([id,t,d])=>`<div class="modeBtn ${mode===id?"on":""}" data-m="${id}"><h3>${t}</h3><p>${d}</p></div>`).join("");
    nav(`<div class="card">${LOGO}<h1>Sala</h1><p class="sub">${host?"Mostre a chave. Clique no nome para trocar time.":"Esperando o dono."}</p><div class="keyBig">${net.key||"-----"}</div>${host?'<button class="ghost" id="copyK" style="margin-top:0">Copiar chave</button>':""}<h2>Jogadores</h2><div class="plist">${list}</div><h2>Modo</h2><div class="modes4">${btns}</div>${host?'<button class="cta" id="goNet">Começar</button>':""}<button class="ghost" id="leave">Sair</button></div>`);
    if(host){
      overlay.querySelectorAll(".modeBtn").forEach(el=>el.onclick=()=>{ mode=el.dataset.m; sendLobby(); renderLobby(); });
      overlay.querySelectorAll(".plist div[data-id]").forEach(el=>el.onclick=()=>{ if(mode!=="team2"&&mode!=="team4") return; const p=net.lobby.find(x=>x.id===el.dataset.id); if(p){ const n=mode==="team4"?4:2; p.team=((p.team||0)+1)%n; sendLobby(); renderLobby(); } });
      document.getElementById("goNet").onclick=hostStart;
      document.getElementById("copyK").onclick=()=>navigator.clipboard.writeText(net.key).then(()=>toast("Chave copiada"));
    }
    document.getElementById("leave").onclick=()=>{ closeNet(); screen="online"; renderMenu(); };
  }

  function renderMenu(){
    state="menu"; hud.style.display="none"; pads.style.display="none"; pauseBtn.style.display="none"; overlay.style.display="flex";
    if(screen==="name"){
      nav(`<div class="card" style="max-width:460px">${LOGO}<h1>HILL FIGHT</h1><p class="sub">Escolha seu nome de usuário.</p><input id="nm" type="text" maxlength="14" placeholder="SEU NOME" value="${user}"/>
      <button class="cta" id="ok">Continuar</button></div>`);
      document.getElementById("ok").onclick=()=>{ const v=(document.getElementById("nm").value||"").trim(); if(v.length<2){ toast("Nome curto"); return; } user=v.slice(0,14); save(); screen="home"; renderMenu(); };
      return;
    }
    if(screen==="home"){
      nav(`<div class="card">${LOGO}<h1>HILL FIGHT</h1><p class="sub">Olá, ${user}. Offline só o baú. O resto é na sala.</p><div class="coins">Moedas: ${bank}</div>
      <button class="cta" id="btnStart">Proteger o baú</button>
      <div class="row" style="margin-top:10px">
        <button class="ghost" id="goOn" style="margin:0">Online</button>
        <button class="ghost" id="goChars" style="margin:0">Personagens</button>
        <button class="ghost" id="goSkills" style="margin:0">Skills</button>
        <button class="ghost" id="goSet" style="margin:0">Configs</button>
      </div>
      <p class="help">ATK clique · ESP1 espaço · ESP2 Q · Cura R (1x) · Sobre E · Gelo F</p></div>`);
      document.getElementById("btnStart").onclick=()=>startLocal();
      document.getElementById("goOn").onclick=()=>{screen="online";renderMenu();};
      document.getElementById("goChars").onclick=()=>{screen="chars";renderMenu();};
      document.getElementById("goSkills").onclick=()=>{screen="skills";renderMenu();};
      document.getElementById("goSet").onclick=()=>{screen="set";renderMenu();};
    } else if(screen==="online"){
      nav(`<div class="card" style="max-width:520px">${LOGO}<h1>Online</h1><p class="sub">O dono escolhe o modo na sala.</p><button class="cta" id="mk">Criar sala</button><h2>Entrar</h2><input id="inkey" type="text" maxlength="8" placeholder="CHAVE"/><button class="cta" id="jn">Entrar</button><button class="ghost" id="back">Voltar</button></div>`);
      document.getElementById("mk").onclick=hostRoom; document.getElementById("jn").onclick=()=>joinRoom(document.getElementById("inkey").value); document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="chars"){
      let cards=""; CHARS.forEach(c=>{ const own=unlocked.includes(c.id),on=selChar===c.id; cards+=`<div class="pick ${on?"on":""} ${own?"":"lock"}" data-id="${c.id}"><div class="mini" id="pv-${c.id}"></div><h3>${c.name}</h3><p>${c.desc}</p><div class="price">${own?(on?"Equipado":"Liberado"):c.cost+" moedas"}</div></div>`; });
      nav(`<div class="card"><div class="tabs"><button class="tab on">Personagens</button><button class="tab" id="toSk">Skills</button><button class="tab" id="toSet">Configs</button></div><div class="coins">Moedas: ${bank}</div><div class="row">${cards}</div><p class="help">Espaço abre a tier list</p><button class="ghost" id="back">Voltar</button></div>`);
      CHARS.forEach(c=>{ const box=document.getElementById("pv-"+c.id); const cv=document.createElement("canvas"); cv.width=96; cv.height=68; box.appendChild(cv); drawMini(cv.getContext("2d"),c,48,34); });
      overlay.querySelectorAll(".pick").forEach(el=>el.onclick=()=>{ const id=el.dataset.id,c=charOf(id); if(unlocked.includes(id)){ selChar=id; save(); renderMenu(); return; } if(bank<c.cost){ toast("Moedas insuficientes"); return; } bank-=c.cost; unlocked.push(id); selChar=id; save(); renderMenu(); });
      document.getElementById("toSk").onclick=()=>{screen="skills";renderMenu();}; document.getElementById("toSet").onclick=()=>{screen="set";renderMenu();}; document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="skills"){
      let cards=""; SKILLS.forEach(s=>{ const own=unlockedSk.includes(s.id),on=selSkill===s.id; cards+=`<div class="pick ${on?"on":""} ${own?"":"lock"}" data-id="${s.id}"><h3>${s.name}</h3><p>${s.desc}</p><div class="price">${own?(on?"Equipada":"Liberada"):s.cost+" moedas"}</div></div>`; });
      nav(`<div class="card"><div class="tabs"><button class="tab" id="toCh">Personagens</button><button class="tab on">Skills</button><button class="tab" id="toSet">Configs</button></div><div class="coins">Moedas: ${bank}</div><div class="row">${cards}</div><button class="ghost" id="back">Voltar</button></div>`);
      overlay.querySelectorAll(".pick").forEach(el=>el.onclick=()=>{ const id=el.dataset.id,s=skillOf(id); if(unlockedSk.includes(id)){ selSkill=id; save(); renderMenu(); return; } if(bank<s.cost){ toast("Moedas insuficientes"); return; } bank-=s.cost; unlockedSk.push(id); selSkill=id; save(); renderMenu(); });
      document.getElementById("toCh").onclick=()=>{screen="chars";renderMenu();}; document.getElementById("toSet").onclick=()=>{screen="set";renderMenu();}; document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="set"){
      nav(`<div class="card" style="max-width:520px">${LOGO}<h1>Configs</h1>
        <div class="setrow"><span>Gráficos</span><button class="ghost" id="gfx">${cfg.gfx==="high"?"Pesados":cfg.gfx==="low"?"Leves":"Médios"}</button></div>
        <div class="setrow"><span>Canhoto</span><button class="ghost" id="lh">${cfg.left?"Sim":"Não"}</button></div>
        <div class="setrow"><span>4 dedos / extras</span><button class="ghost" id="ff">${cfg.four!==false?"Sim":"Não"}</button></div>
        <div class="setrow"><span>Usuário</span><button class="ghost" id="ren">${user}</button></div>
        <button class="ghost" id="back">Voltar</button></div>`);
      document.getElementById("gfx").onclick=()=>{ cfg.gfx=cfg.gfx==="low"?"med":cfg.gfx==="med"?"high":"low"; save(); resize(); renderMenu(); };
      document.getElementById("lh").onclick=()=>{ cfg.left=!cfg.left; save(); layoutPads(); renderMenu(); };
      document.getElementById("ff").onclick=()=>{ cfg.four=!(cfg.four!==false); save(); layoutPads(); renderMenu(); };
      document.getElementById("ren").onclick=()=>{ screen="name"; renderMenu(); };
      document.getElementById("back").onclick=()=>{ screen="home"; renderMenu(); };
    } else if(screen==="tier"){
      nav(`<div class="card" style="max-width:560px">${LOGO}<h1>Tier list</h1>
        <p class="sub">Elenco atual. Espaço só funciona no menu de personagens.</p>
        <div class="pick on"><h3>S — Nok</h3><p>Limpa a tela e o eixo defende. Melhor no baú e no boss.</p></div>
        <div class="pick on"><h3>S — Roy</h3><p>Trovão e corrente cobrem o mapa. Forte no FFA e no time.</p></div>
        <div class="pick"><h3>A — Meil</h3><p>Chuva e leque controlam grupo. Sofre no corpo a corpo.</p></div>
        <div class="pick"><h3>A — Fror</h3><p>Trinca decide luta. Resfriar segura quem cola.</p></div>
        <div class="pick"><h3>A — Feth</h3><p>Tornado e lava zonam o chão. Bom no baú e na colina.</p></div>
        <div class="pick"><h3>B — Kai</h3><p>Firme e simples. Melhor para começar.</p></div>
        <div class="pick"><h3>B — Lun</h3><p>Sono e escuridão são fortes, mas o descanso te para.</p></div>
        <div class="pick"><h3>B — Rist</h3><p>Dash e titânio doem se o tempo estiver certo.</p></div>
        <button class="ghost" id="back">Voltar</button></div>`);
      document.getElementById("back").onclick=()=>{ screen="chars"; renderMenu(); };
    }
  }

  pathsDef(); genWallsOpen(); genDecor(); renderMenu(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
