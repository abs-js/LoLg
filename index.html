<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Hill Fight</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d160c;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#f3efe4;user-select:none;touch-action:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
#hud{position:fixed;inset:0;pointer-events:none;display:none;flex-direction:column}
#topbar{display:flex;justify-content:space-between;padding:10px 12px;gap:8px}
.panel{background:rgba(18,28,16,.86);border:2px solid rgba(244,201,93,.35);border-radius:12px;padding:8px 12px}
.bar-wrap{width:min(240px,46vw)}
.label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.8;margin-bottom:3px}
.bar{height:11px;border-radius:8px;background:#1a2218;overflow:hidden;border:1px solid #000}
.bar>i{display:block;height:100%;width:0}
#hpFill{background:linear-gradient(90deg,#c0392b,#e74c3c)}
#objFill{background:linear-gradient(90deg,#b8860b,#f4c95d)}
#chargeFill{background:linear-gradient(90deg,#1f6feb,#7ec8ff)}
#waveBox{text-align:right;min-width:120px}#waveBox b{color:#f4c95d;font-size:18px}
#bottomHud{margin-top:auto;padding:10px 12px 22px}.ability{font-size:11px;max-width:52vw}
#overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(6,10,6,.82)}
.card{width:min(920px,96vw);max-height:94vh;overflow:auto;background:linear-gradient(180deg,#223820,#152314);border:3px solid #f4c95d;border-radius:18px;padding:18px}
h1{font-size:clamp(26px,6vw,40px);text-align:center;color:#f4c95d;text-shadow:0 3px 0 #3a2a08}
.sub{text-align:center;opacity:.85;margin:6px 0 14px;font-size:13px}
h2{font-size:13px;color:#c8e0b0;margin:8px 0;letter-spacing:.08em;text-transform:uppercase}
.coins{text-align:center;color:#f4c95d;font-weight:700;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.pick{flex:1 1 150px;background:#1a2a18;border:2px solid #3d5a34;border-radius:12px;padding:10px;cursor:pointer;pointer-events:auto}
.pick.on{border-color:#f4c95d}.pick.lock{opacity:.78}
.pick h3{font-size:14px;margin-bottom:3px}.pick p{font-size:12px;opacity:.9}
.price{color:#f4c95d;font-weight:700;font-size:12px;margin-top:4px}
.mini{height:72px;display:flex;align-items:center;justify-content:center}
button.cta,button.ghost,button.tab{pointer-events:auto;cursor:pointer;border-radius:12px;font-weight:800}
button.cta{display:block;width:100%;margin-top:12px;background:linear-gradient(180deg,#f4c95d,#d4a017);color:#2a1c04;font-size:17px;border:none;padding:12px}
button.ghost{background:transparent;color:#dce8d0;border:2px solid #4a6340;padding:10px 12px;width:100%;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:12px}
button.tab{flex:1;border:2px solid #4a6340;background:#1a2a18;color:#e8f0dc;padding:10px 6px;font-size:13px}
button.tab.on{border-color:#f4c95d;background:#2a4024;color:#f4c95d}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modes3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.modeBtn{pointer-events:auto;cursor:pointer;background:#1a2a18;border:2px solid #3d5a34;border-radius:14px;padding:12px 8px;text-align:center}
.modeBtn.on{border-color:#f4c95d}
.modeBtn h3{color:#fff;margin-bottom:4px;font-size:14px}.modeBtn p{font-size:11px;opacity:.85}
.help{margin-top:10px;font-size:12px;opacity:.75;text-align:center;line-height:1.4}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:2px solid #4a6340;background:#132012;color:#f3efe4;font-size:18px;letter-spacing:.2em;text-align:center;text-transform:uppercase}
.keyBig{font-size:clamp(28px,8vw,42px);letter-spacing:.28em;text-align:center;color:#f4c95d;font-weight:800;margin:8px 0 12px}
.plist{background:#132012;border-radius:10px;padding:8px 12px;margin:8px 0}
.plist div{padding:6px 0;border-bottom:1px solid #2a3c26;font-size:14px;cursor:pointer}
#toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:#141c10;border:1px solid #f4c95d;padding:8px 14px;border-radius:8px;display:none;z-index:12}
#loadScr{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:#071008;flex-direction:column;padding:24px;text-align:center}
#loadScr h2{color:#f4c95d;font-size:28px;margin-bottom:8px}
.lbar{width:min(320px,80vw);height:14px;background:#132012;border:2px solid #f4c95d;border-radius:10px;overflow:hidden}
.lbar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7ec8ff,#f4c95d)}
#pads{position:fixed;inset:0;pointer-events:none;z-index:4;display:none}
#joyBase,#btnP,#btnS,#btnL{pointer-events:auto;position:absolute}
#joyBase{left:18px;bottom:22px;width:128px;height:128px;border-radius:50%;background:rgba(20,30,16,.38);border:3px solid rgba(244,201,93,.35)}
#joyKnob{position:absolute;left:39px;top:39px;width:50px;height:50px;border-radius:50%;background:rgba(244,201,93,.85)}
.abtn{width:72px;height:72px;border-radius:50%;border:3px solid rgba(255,255,255,.25);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
#btnP{right:28px;bottom:34px;background:rgba(196,70,50,.82)}
#btnS{right:112px;bottom:86px;background:rgba(40,90,180,.82);width:64px;height:64px;font-size:11px}
#btnL{right:22px;bottom:118px;background:rgba(120,50,160,.82);width:58px;height:58px;font-size:11px}
#pauseBtn{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:5;pointer-events:auto;display:none;background:#121c10;color:#f4c95d;border:2px solid #f4c95d;border-radius:10px;padding:6px 12px;font-weight:800}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button id="pauseBtn">Menu</button>
<div id="hud">
  <div id="topbar">
    <div class="panel bar-wrap">
      <div class="label">Vida</div><div class="bar"><i id="hpFill"></i></div>
      <div class="label" style="margin-top:6px" id="objLabel">Baú</div><div class="bar"><i id="objFill"></i></div>
      <div class="label" style="margin-top:6px">Cargas</div><div class="bar"><i id="chargeFill"></i></div>
    </div>
    <div class="panel" id="waveBox">
      <div id="waveLine">Onda <b>1</b></div>
      <div>Gosmas <b id="killNum">0</b></div>
      <div>Moedas <b id="runCoins">0</b></div>
    </div>
  </div>
  <div id="bottomHud"><div class="panel ability" id="abilText"></div></div>
</div>
<div id="pads">
  <div id="joyBase"><div id="joyKnob"></div></div>
  <div class="abtn" id="btnL">Q</div><div class="abtn" id="btnS">ESP</div><div class="abtn" id="btnP">ATK</div>
</div>
<div id="toast"></div>
<div id="loadScr"><h2 id="loadTitle">Carregando</h2><p id="loadTip">A colina acorda...</p><div class="lbar"><i id="loadBar"></i></div></div>
<div id="overlay"></div>
<script>
(() => {
  const canvas=document.getElementById("c"),ctx=canvas.getContext("2d");
  const hud=document.getElementById("hud"),overlay=document.getElementById("overlay");
  const pads=document.getElementById("pads"),pauseBtn=document.getElementById("pauseBtn");
  const loadScr=document.getElementById("loadScr");
  const WORLD={w:1840,h:1380},CHEST={x:920,y:690,r:34,hp:100,max:100};
  const TIPS=["Especial só com orbes azuis.","Pedras e rios bloqueiam.","Treino: você revive.","FFA: último de pé.","Time: clique no nome para trocar."];
  const TEAM=["Ouro","Anil"],TCOL=["#f4c95d","#7ec8ff"];
  const CHARS=[
    {id:"leo",name:"Léo",color:"#2f6fbf",cost:0,weapon:"sword",desc:"Cone, giro e fissura.",hp:120,speed:195,pName:"Corte",sName:"Giro",lName:"Fissura",lUses:3,pDmg:18,sDmg:16,lDmg:36},
    {id:"maya",name:"Maya",color:"#2f9e57",cost:80,weapon:"bow",desc:"Flecha, chuva e armadilha.",hp:95,speed:215,pName:"Flecha",sName:"Chuva",lName:"Armadilha",lUses:3,pDmg:17,sDmg:10,lDmg:40},
    {id:"kai",name:"Kai",color:"#7a3fd0",cost:110,weapon:"staff",desc:"Quique, meteoro e gelo.",hp:90,speed:200,pName:"Quique",sName:"Meteoro",lName:"Nova",lUses:2,pDmg:16,sDmg:44,lDmg:14},
    {id:"bia",name:"Bia",color:"#d24b3a",cost:140,weapon:"mace",desc:"Escudada, puxão e cúpula.",hp:155,speed:172,pName:"Escudada",sName:"Puxão",lName:"Cúpula",lUses:2,pDmg:20,sDmg:12,lDmg:0},
    {id:"nia",name:"Nia",color:"#e85d8c",cost:90,weapon:"dagger",desc:"Facada, salto e nuvem.",hp:98,speed:230,pName:"Facada",sName:"Salto",lName:"Nuvem",lUses:3,pDmg:11,sDmg:22,lDmg:8},
    {id:"teo",name:"Téo",color:"#e07a2f",cost:100,weapon:"spear",desc:"Investida, varredura e furo.",hp:112,speed:198,pName:"Investida",sName:"Varredura",lName:"Furo",lUses:2,pDmg:20,sDmg:18,lDmg:32},
    {id:"luna",name:"Luna",color:"#2cb8c8",cost:130,weapon:"orb",desc:"Orbe, poço e sono.",hp:92,speed:205,pName:"Orbe",sName:"Poço",lName:"Sono",lUses:2,pDmg:15,sDmg:8,lDmg:6},
    {id:"guto",name:"Guto",color:"#c4a035",cost:150,weapon:"hammer",desc:"Pisada, anéis e atordoa.",hp:160,speed:162,pName:"Pisada",sName:"Anéis",lName:"Atordoa",lUses:2,pDmg:26,sDmg:16,lDmg:12},
    {id:"ravi",name:"Ravi",color:"#dfe6ea",cost:170,weapon:"rang",desc:"Disco, órbita e super.",hp:105,speed:208,pName:"Disco",sName:"Órbita",lName:"Super",lUses:2,pDmg:14,sDmg:9,lDmg:28},
    {id:"sol",name:"Sol",color:"#e6b422",cost:190,weapon:"sun",desc:"Feixe, manchas e brilho.",hp:100,speed:196,pName:"Feixe",sName:"Manchas",lName:"Brilho",lUses:2,pDmg:22,sDmg:14,lDmg:10}
  ];
  const SKILLS=[
    {id:"haste",name:"Passo Ligeiro",desc:"+22% velocidade",cost:0},
    {id:"vita",name:"Couraça",desc:"+35 vida",cost:50},
    {id:"edge",name:"Lâmina",desc:"+22% dano",cost:50},
    {id:"flow",name:"Coletor",desc:"Orbes +50%",cost:60},
    {id:"spark",name:"Faísca",desc:"Raio extra a cada 3",cost:70},
    {id:"root",name:"Raízes",desc:"Primário deixa lento",cost:70}
  ];
  const SHOP=[
    {id:"hpPot",name:"Poção extra",desc:"+20 vida no início",cost:40},
    {id:"extraQ",name:"Carga extra",desc:"+1 limitado",cost:55},
    {id:"boot",name:"Botas",desc:"+12 velocidade",cost:35},
    {id:"charm",name:"Amuleto",desc:"+25 vida no baú",cost:50}
  ];

  let bank=+localStorage.getItem("hf_coins")||0;
  let bought=JSON.parse(localStorage.getItem("hf_shop")||"{}");
  let unlockedChars=JSON.parse(localStorage.getItem("hf_uchars")||'["leo"]');
  let unlockedSkills=JSON.parse(localStorage.getItem("hf_uskills")||'["haste"]');
  let selChar=localStorage.getItem("hf_selC")||"leo";
  let selSkill=localStorage.getItem("hf_selS")||"haste";
  if(!unlockedChars.includes(selChar)) selChar="leo";
  if(!unlockedSkills.includes(selSkill)) selSkill="haste";

  let screen="home",mode="defend",state="menu";
  let W=800,H=600,dpr=1,cam={x:0,y:0},t=0,last=0;
  let actors=[],slimes=[],shots=[],fx=[],texts=[],drops=[],zones=[];
  let leaves=[],trees=[],bushes=[],flowers=[],paths=[],rocks=[],rivers=[],spots=[];
  let wave=1,toSpawn=0,spawnWait=0,waveWait=0,kills=0,runCoins=0,shake=0,orbT=0;
  let qPressed=false,wantS=false,wantP=false;
  const keys=Object.create(null),mouse={x:400,y:300,down:false,rd:false},joy={mx:0,my:0};
  const net={role:"solo",peer:null,conns:[],key:null,lobby:[],meId:"local",acc:0,nid:1};

  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const lerp=(a,b,k)=>a+(b-a)*k;
  const dist=(a,b)=>Math.hypot((a.x||0)-(b.x||0),(a.y||0)-(b.y||0));
  const ang=(a,b)=>Math.atan2(b.y-a.y,b.x-a.x);
  let _rng=Math.random;
  const rand=(a,b)=>a+_rng()*(b-a);
  const irand=(a,b)=>a+Math.floor(_rng()*(b-a+1));
  const pick=a=>a[irand(0,a.length-1)];
  function seedRng(s){ let n=(+s||1)>>>0; _rng=()=>{ n=(Math.imul(n,1664525)+1013904223)>>>0; return n/4294967296; }; }
  function freeRng(){ _rng=Math.random; }
  const charOf=id=>CHARS.find(c=>c.id===id)||CHARS[0];
  const skillOf=id=>SKILLS.find(s=>s.id===id)||SKILLS[0];
  const isPvp=()=>mode==="ffa"||mode==="team";
  const living=()=>actors.filter(a=>a.alive&&a.hp>0);
  function foes(p){ if(!p||!isPvp()) return []; return living().filter(a=>a.id!==p.id&&(mode!=="team"||a.team!==p.team)); }
  function foesId(id){ return foes(actors.find(a=>a.id===id)||{id,team:-9}); }
  function save(){ localStorage.setItem("hf_coins",bank); localStorage.setItem("hf_shop",JSON.stringify(bought)); localStorage.setItem("hf_uchars",JSON.stringify(unlockedChars)); localStorage.setItem("hf_uskills",JSON.stringify(unlockedSkills)); localStorage.setItem("hf_selC",selChar); localStorage.setItem("hf_selS",selSkill); }
  function toast(m){ const e=document.getElementById("toast"); e.textContent=m; e.style.display="block"; clearTimeout(toast._t); toast._t=setTimeout(()=>e.style.display="none",1600); }
  let actx=null;
  function beep(f,d,ty,v){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(),g=actx.createGain(); o.type=ty||"square"; o.frequency.value=f; g.gain.value=v||.05; g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g); g.connect(actx.destination); o.start(); o.stop(actx.currentTime+d);}catch(e){} }
  function showLoad(title,ms){ return new Promise(res=>{ loadScr.style.display="flex"; document.getElementById("loadTitle").textContent=title; document.getElementById("loadTip").textContent=pick(TIPS); const bar=document.getElementById("loadBar"); bar.style.width="0"; const t0=performance.now(); (function step(n){ const k=Math.min(1,(n-t0)/ms); bar.style.width=(k*100)+"%"; if(k<1) requestAnimationFrame(step); else setTimeout(()=>{loadScr.style.display="none";res();},150); })(t0); }); }

  function resize(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  addEventListener("resize",resize); resize();
  addEventListener("keydown",e=>{ keys[e.code]=true; if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault(); if(e.code==="KeyQ") qPressed=true; if(e.code==="Escape"&&state==="play") openPause(); });
  addEventListener("keyup",e=>keys[e.code]=false);
  canvas.addEventListener("mousedown",e=>{ if(e.button===0) mouse.down=true; if(e.button===2) mouse.rd=true; });
  addEventListener("mouseup",e=>{ if(e.button===0) mouse.down=false; if(e.button===2) mouse.rd=false; });
  canvas.addEventListener("contextmenu",e=>e.preventDefault());
  canvas.addEventListener("mousemove",e=>{ const r=canvas.getBoundingClientRect(); mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; });
  const isTouch=()=>matchMedia("(pointer: coarse)").matches||"ontouchstart" in window;
  function bindPad(el,on,off){ const d=ev=>{ev.preventDefault();on();},u=ev=>{ev.preventDefault();off();}; el.addEventListener("touchstart",d,{passive:false}); el.addEventListener("touchend",u,{passive:false}); el.addEventListener("mousedown",d); addEventListener("mouseup",u); }
  bindPad(document.getElementById("btnP"),()=>wantP=true,()=>wantP=false);
  bindPad(document.getElementById("btnS"),()=>wantS=true,()=>wantS=false);
  bindPad(document.getElementById("btnL"),()=>{qPressed=true;},()=>{});
  const joyBase=document.getElementById("joyBase"),joyKnob=document.getElementById("joyKnob");
  function setKnob(x,y){ joyKnob.style.left=(39+x*34)+"px"; joyKnob.style.top=(39+y*34)+"px"; }
  function joyEv(ev){ const rec=joyBase.getBoundingClientRect(); const tc=ev.changedTouches?ev.changedTouches[0]:ev; let dx=tc.clientX-(rec.left+rec.width/2),dy=tc.clientY-(rec.top+rec.height/2); const m=Math.hypot(dx,dy)||1,max=rec.width*.42; if(m>max){dx=dx/m*max;dy=dy/m*max;} joy.mx=dx/max; joy.my=dy/max; setKnob(joy.mx,joy.my); }
  joyBase.addEventListener("touchstart",e=>{e.preventDefault();joyEv(e);},{passive:false});
  joyBase.addEventListener("touchmove",e=>{e.preventDefault();joyEv(e);},{passive:false});
  joyBase.addEventListener("touchend",e=>{e.preventDefault();joy.mx=0;joy.my=0;setKnob(0,0);},{passive:false});
  const toW=p=>({x:p.x+cam.x,y:p.y+cam.y});

  function segD(px,py,x1,y1,x2,y2){ const vx=x2-x1,vy=y2-y1,l2=vx*vx+vy*vy||1,u=clamp(((px-x1)*vx+(py-y1)*vy)/l2,0,1); return Math.hypot(px-(x1+u*vx),py-(y1+u*vy)); }
  function blocked(x,y,r){ if(x<r+8||y<r+8||x>WORLD.w-r-8||y>WORLD.h-r-8) return true; for(const rk of rocks) if(Math.hypot(x-rk.x,y-rk.y)<r+rk.r-1) return true; for(const rv of rivers) for(let i=0;i<rv.pts.length-1;i++) if(segD(x,y,rv.pts[i].x,rv.pts[i].y,rv.pts[i+1].x,rv.pts[i+1].y)<r+rv.w*.48) return true; return false; }
  function tryMove(e,dx,dy){ if(!blocked(e.x+dx,e.y+dy,e.r)){e.x+=dx;e.y+=dy;return true;} if(!blocked(e.x+dx,e.y,e.r)){e.x+=dx;return true;} if(!blocked(e.x,e.y+dy,e.r)){e.y+=dy;return true;} return false; }
  function keep(x,y,rad){ return Math.hypot(x-CHEST.x,y-CHEST.y)>rad+170; }
  function genDecor(){ trees=[];bushes=[];flowers=[];leaves=[]; for(let i=0;i<70;i++){ const x=rand(40,WORLD.w-40),y=rand(40,WORLD.h-40); if(keep(x,y,26)) trees.push({x,y,s:rand(22,38),hue:rand(-8,14),sw:rand(0,6)}); } for(let i=0;i<50;i++){ const x=rand(30,WORLD.w-30),y=rand(30,WORLD.h-30); if(keep(x,y,16)) bushes.push({x,y,s:rand(10,18)}); } for(let i=0;i<80;i++) flowers.push({x:rand(20,WORLD.w-20),y:rand(20,WORLD.h-20),c:pick(["#e86a92","#f4c95d","#7ec8ff","#fff"])}); for(let i=0;i<40;i++) leaves.push({x:rand(0,WORLD.w),y:rand(0,WORLD.h),vx:rand(-12,12),vy:rand(8,22),rot:rand(0,6),c:pick(["#c45c26","#d4a017","#6b8f3a"]),s:rand(4,8)}); }
  function genWalls(){ rocks=[];rivers=[]; for(let n=0;n<3;n++){ const pts=[]; let x=n===1?rand(240,WORLD.w-240):(n===0?rand(90,240):rand(WORLD.w-240,WORLD.w-90)), y=n===1?50:rand(200,WORLD.h-200); pts.push({x,y}); const vert=n!==1; for(let k=0;k<7;k++){ if(vert){y+=(WORLD.h-100)/7;x=clamp(x+rand(-90,90),70,WORLD.w-70);} else {x+=(WORLD.w-100)/7;y=clamp(y+rand(-80,80),70,WORLD.h-70);} if(keep(x,y,20)) pts.push({x,y}); } if(pts.length>=2) rivers.push({pts,w:46}); } for(let i=0;i<26;i++){ const x=rand(90,WORLD.w-90),y=rand(90,WORLD.h-90),r=rand(18,34); if(keep(x,y,r+10)) rocks.push({x,y,r,sh:rand(-8,8)}); } spots=[]; const add=(x,y)=>{ if(!blocked(x,y,16)) spots.push({x,y}); }; for(let x=90;x<WORLD.w-90;x+=36){add(x,90);add(x,WORLD.h-90);} for(let y=90;y<WORLD.h-90;y+=36){add(90,y);add(WORLD.w-90,y);} }
  function pathsDef(){ paths=[{x:CHEST.x,y:CHEST.y,r:92,inner:54}]; for(let i=0;i<5;i++){ const a=(i/5)*Math.PI*2+.3; paths.push({x1:CHEST.x+Math.cos(a)*80,y1:CHEST.y+Math.sin(a)*80,x2:CHEST.x+Math.cos(a)*640,y2:CHEST.y+Math.sin(a)*480,w:36}); } }

      document.getElementById("mDef").onclick=()=>{mode="defend";renderMenu();}; document.getElementById("mTr").onclick=()=>{mode="train";renderMenu();}; document.getElementById("btnStart").onclick=()=>startLocal(); document.getElementById("goOn").onclick=()=>{screen="online";renderMenu();}; document.getElementById("goChars").onclick=()=>{screen="chars";renderMenu();}; document.getElementById("goSkills").onclick=()=>{screen="skills";renderMenu();}; document.getElementById("goShop").onclick=()=>{screen="shop";renderMenu();};
    } else if(screen==="online"){
      nav(`<div class="card" style="max-width:520px"><h1>Online</h1><p class="sub">O dono escolhe: Proteger baú, Free-for-all ou Time.</p><button class="cta" id="mk">Criar sala</button><h2>Entrar</h2><input id="inkey" type="text" maxlength="8" placeholder="CHAVE"/><button class="cta" id="jn">Entrar</button><button class="ghost" id="back">Voltar</button></div>`);
      document.getElementById("mk").onclick=hostRoom; document.getElementById("jn").onclick=()=>joinRoom(document.getElementById("inkey").value); document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="chars"){
      let cards=""; CHARS.forEach(c=>{ const own=unlockedChars.includes(c.id),on=selChar===c.id; cards+=`<div class="pick ${on?"on":""} ${own?"":"lock"}" data-id="${c.id}"><div class="mini" id="pv-${c.id}"></div><h3>${c.name}</h3><p>${c.desc}</p><div class="price">${own?(on?"Equipado":"Liberado"):c.cost+" moedas"}</div></div>`; });
      nav(`<div class="card"><div class="tabs"><button class="tab on">Personagens</button><button class="tab" id="toSk">Skills</button><button class="tab" id="toSh">Loja</button></div><div class="coins">Moedas: ${bank}</div><div class="row">${cards}</div><button class="ghost" id="back">Voltar</button></div>`);
      CHARS.forEach(c=>{ const box=document.getElementById("pv-"+c.id); const cv=document.createElement("canvas"); cv.width=96; cv.height=68; box.appendChild(cv); drawMini(cv.getContext("2d"),c,48,34); });
      overlay.querySelectorAll(".pick").forEach(el=>el.onclick=()=>{ const id=el.dataset.id,c=charOf(id); if(unlockedChars.includes(id)){ selChar=id; save(); renderMenu(); return; } if(bank<c.cost){ toast("Moedas insuficientes"); return; } bank-=c.cost; unlockedChars.push(id); selChar=id; save(); renderMenu(); });
      document.getElementById("toSk").onclick=()=>{screen="skills";renderMenu();}; document.getElementById("toSh").onclick=()=>{screen="shop";renderMenu();}; document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="skills"){
      let cards=""; SKILLS.forEach(s=>{ const own=unlockedSkills.includes(s.id),on=selSkill===s.id; cards+=`<div class="pick ${on?"on":""} ${own?"":"lock"}" data-id="${s.id}"><h3>${s.name}</h3><p>${s.desc}</p><div class="price">${own?(on?"Equipada":"Liberada"):s.cost+" moedas"}</div></div>`; });
      nav(`<div class="card"><div class="tabs"><button class="tab" id="toCh">Personagens</button><button class="tab on">Skills</button><button class="tab" id="toSh">Loja</button></div><div class="coins">Moedas: ${bank}</div><div class="row">${cards}</div><button class="ghost" id="back">Voltar</button></div>`);
      overlay.querySelectorAll(".pick").forEach(el=>el.onclick=()=>{ const id=el.dataset.id,s=skillOf(id); if(unlockedSkills.includes(id)){ selSkill=id; save(); renderMenu(); return; } if(bank<s.cost){ toast("Moedas insuficientes"); return; } bank-=s.cost; unlockedSkills.push(id); selSkill=id; save(); renderMenu(); });
      document.getElementById("toCh").onclick=()=>{screen="chars";renderMenu();}; document.getElementById("toSh").onclick=()=>{screen="shop";renderMenu();}; document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    } else if(screen==="shop"){
      let cards=""; SHOP.forEach(it=>{ const own=!!bought[it.id]; cards+=`<div class="pick ${own?"on":""}" data-id="${it.id}"><h3>${it.name}</h3><p>${it.desc}</p><div class="price">${own?"Comprado":it.cost+" moedas"}</div></div>`; });
      nav(`<div class="card"><div class="tabs"><button class="tab" id="toCh">Personagens</button><button class="tab" id="toSk">Skills</button><button class="tab on">Loja</button></div><div class="coins">Moedas: ${bank}</div><div class="row">${cards}</div><button class="ghost" id="back">Voltar</button></div>`);
      overlay.querySelectorAll(".pick").forEach(el=>el.onclick=()=>{ const it=SHOP.find(s=>s.id===el.dataset.id); if(bought[it.id]) return; if(bank<it.cost){ toast("Moedas insuficientes"); return; } bank-=it.cost; bought[it.id]=true; save(); renderMenu(); });
      document.getElementById("toCh").onclick=()=>{screen="chars";renderMenu();}; document.getElementById("toSk").onclick=()=>{screen="skills";renderMenu();}; document.getElementById("back").onclick=()=>{screen="home";renderMenu();};
    }
  }
  pathsDef(); genWalls(); genDecor(); renderMenu(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
